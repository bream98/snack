services:
  # 1. Load Balancer / Proxy
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ws-node-1
      - ws-node-2

  # 2. Backend WebSocket Node 1
  ws-node-1:
    build:
      context: ..
      dockerfile_inline: |
        FROM golang:1.22-alpine
        WORKDIR /app
        ENV GOTOOLCHAIN=auto
        COPY . .
        RUN go mod tidy
        RUN go build -o /ws-node cmd/ws-node/main.go
        CMD ["/ws-node"]
    restart: unless-stopped
    environment:
      - NODE_ID=node-1
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - KAFKA_ADDR=kafka:9092
      - POSTGRES_DSN=host=postgres user=snack password=snackpassword dbname=snackdb port=5432 sslmode=disable
      - JWT_SECRET=secret
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  # 2. Backend WebSocket Node 2
  ws-node-2:
    build:
      context: ..
      dockerfile_inline: |
        FROM golang:1.22-alpine
        WORKDIR /app
        ENV GOTOOLCHAIN=auto
        COPY . .
        RUN go mod tidy
        RUN go build -o /ws-node cmd/ws-node/main.go
        CMD ["/ws-node"]
    restart: unless-stopped
    environment:
      - NODE_ID=node-2
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - KAFKA_ADDR=kafka:9092
      - POSTGRES_DSN=host=postgres user=snack password=snackpassword dbname=snackdb port=5432 sslmode=disable
      - JWT_SECRET=secret
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  # 3. Redis Session Hub & PubSub Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 4. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snack
      POSTGRES_PASSWORD: snackpassword
      POSTGRES_DB: snackdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snack -d snackdb"]
      interval: 2s
      timeout: 3s
      retries: 10

  # 5. Zookeeper & Kafka Event Bus
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  # 6. Kafka Event Worker
  worker-1:
    build:
      context: ..
      dockerfile_inline: |
        FROM golang:1.22-alpine
        WORKDIR /app
        ENV GOTOOLCHAIN=auto
        COPY . .
        RUN go mod tidy
        RUN go build -o /worker cmd/worker/main.go
        CMD ["/worker"]
    restart: unless-stopped
    environment:
      - WORKER_ID=worker-1
      - REDIS_ADDR=redis:6379
      - KAFKA_ADDR=kafka:9092
      - POSTGRES_DSN=host=postgres user=snack password=snackpassword dbname=snackdb port=5432 sslmode=disable
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
